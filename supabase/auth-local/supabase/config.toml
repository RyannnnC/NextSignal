# Supabase CLI 3.2.0 isolated local development project.
project_id = "nextsignal-auth-local"
[api]
enabled = true
port = 55421
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false
[db]
port = 55422
shadow_port = 55420
major_version = 17
[db.seed]
enabled = false
[studio]
enabled = true
port = 55423
api_url = "http://127.0.0.1"
[local_smtp]
enabled = true
port = 55424
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback", "http://127.0.0.1:3000/auth/callback?flow=recovery"]
enable_signup = true
minimum_password_length = 12
[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
[realtime]
enabled = false
[storage]
enabled = false
[edge_runtime]
enabled = false
[analytics]
enabled = false
