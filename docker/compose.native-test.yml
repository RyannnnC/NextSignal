services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: kyb_native_test
      POSTGRES_PASSWORD: ${KYB_TEST_PG_PASSWORD:?Generated by the native test runner}
    ports:
      - "127.0.0.1:${KYB_TEST_PG_PORT:-54329}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kyb_native_test"]
      interval: 1s
      timeout: 3s
      retries: 30
